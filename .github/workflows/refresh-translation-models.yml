name: Refresh translation models

# Lives on the default branch because GitHub Actions only fires `schedule:`
# from there. The scripts it runs are on `es`, which is what it checks out;
# nothing is committed back, the work is entirely in the database.
on:
  schedule:
    - cron: '23 5 * * *' # off-the-hour, to miss the top-of-hour scheduling crush
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: es
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: yarn install --frozen-lockfile --ignore-scripts
      - name: Probe the catalogue and store the snapshot
        env:
          OR_API_KEY: ${{ secrets.OR_API_KEY }}
          RSS_DB_URL: ${{ secrets.RSS_DB_URL || secrets.TURSO_DATABASE_URL }}
          RSS_DB_TOKEN: ${{ secrets.RSS_DB_TOKEN || secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/refreshTranslationModels.mjs
